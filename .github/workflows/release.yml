name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p pkg
          cp -r dist pkg/
          cp -r node_modules pkg/
          cp host.json pkg/
          cp package.json pkg/
          ( cd pkg && zip -rq "$GITHUB_WORKSPACE/bab.zip" . )
          ls -la bab.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bab
          path: bab.zip
          retention-days: 30
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
