name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Verify ESM imports resolve
        env:
          BAB_DB_CONNECTION_STRING: "mongodb://localhost:27017/test"
        run: node --input-type=module -e "await import('./dist/functions/http.js')"
